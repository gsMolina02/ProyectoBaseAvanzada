{% extends "base.html" %}

{% block title %}Registro - Banco Pichincha{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus"></i>
            <h2>Registro de Cliente</h2>
            <p>Completa el formulario para crear tu cuenta</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="cedula">
                    <i class="fas fa-id-card"></i> Cédula
                </label>
                <input 
                    type="text" 
                    id="cedula" 
                    name="cedula" 
                    class="form-control" 
                    placeholder="Número de cédula"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">
                        <i class="fas fa-user"></i> Nombre
                    </label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        class="form-control" 
                        placeholder="Nombre"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="apellido">
                        <i class="fas fa-user"></i> Apellido
                    </label>
                    <input 
                        type="text" 
                        id="apellido" 
                        name="apellido" 
                        class="form-control" 
                        placeholder="Apellido"
                        required
                    >
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="correo@ejemplo.com"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="telefono">
                    <i class="fas fa-phone"></i> Teléfono
                </label>
                <input 
                    type="text" 
                    id="telefono" 
                    name="telefono" 
                    class="form-control" 
                    placeholder="Número de teléfono"
                    pattern="[0-9]{10}"
                    maxlength="10"
                >
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-check"></i> Registrarse
            </button>
        </form>
        
        <div class="auth-footer">
            <p>¿Ya tienes una cuenta?</p>
            <a href="{{ url_for('login') }}" class="link">Inicia sesión aquí</a>
        </div>
    </div>
</div>
{% endblock %}
